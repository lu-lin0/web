<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影片辨識介面</title>
    
    <!-- 引入 MediaPipe Holistic -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>


        .header-title {
            color: var(--white-color);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            color: var(--white-color);
            font-size: 0.95rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        /* 主佈局 */
        .recognition-layout {
            margin-top: 100px;
            display: grid;
            grid-template-columns: 640px 320px;
            gap: 25px;
            max-width: 1000px;
            width: 90%;
            margin-bottom: 40px;
            align-items: start;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 檔案上傳區塊 */
        .upload-section {
            background: rgba(13, 15, 29, 0.85);
            border: 2px dashed var(--card-border);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            color: var(--white-color);
            transition: border-color 0.3s ease;
        }

        .upload-section:hover {
            border-color: #00f2fe;
        }

        .file-input {
            display: none;
        }

        .upload-label {
            display: inline-block;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .upload-label:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* 影片與 Canvas 圖層疊加容器 */
        .video-container {
            position: relative;
            width: 640px;
            height: 480px;
            background-color: #000000;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        /* 底層影片 (可直接觀察影片畫面) */
        #input_video {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
            object-fit: contain;
            z-index: 1;
        }

        /* 上層 Canvas (透明背景，專門繪製關鍵特徵點) */
        #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 640px;
            height: 480px;
            z-index: 2;
            pointer-events: none; /* 避免擋住影片控制點擊 */
        }

        /* 控制按鈕區塊 */
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: #ffffff;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .btn-start {
            background: var(--secondary-gradient);
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
        }

        .btn-start:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 239, 125, 0.5);
        }

        .btn-stop {
            background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
        }

        .btn-stop:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.5);
        }

        .btn:disabled {
            background: #555555;
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        
    </style>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>

    <!-- 頂部導覽列 -->
    <div id="header">
         <a href="主介面.html" class="nav-link">首頁</a>
    </div>

    <!-- 主介面佈局 -->
    <div class="recognition-layout">
    
        <!-- 左欄：上傳區、影片顯示、控制按鈕、預測結果 -->
        <div class="left-column">
            
            

            <div class="video-container">
                <!-- 顯示內建播放器的影片標籤，允許點擊播放或調整進度 -->
                <video id="input_video" controls playsinline muted></video>
                <canvas id="output_canvas" width="640" height="480"></canvas>
            </div>

            <div class="controls">
                <button id="startBtn" class="btn btn-start" onclick="startVideoRecognition()" disabled>開始播放與辨識</button>
                <button id="stopBtn" class="btn btn-stop" onclick="stopVideoRecognition()" disabled>暫停影片</button>
            </div>

            <div class="prediction-card">
                <div class="prediction-title">後端辨識結果</div>
                <div id="result" class="prediction-text">請先選擇影片檔案</div>
            </div>
        </div>

        <!-- 右欄：選單與連結 -->
        <div class="right-column">
                <!-- 影片選擇器 -->
            <div class="upload-section">
                <label for="videoUpload" class="upload-label">📁 選擇手語影片 (MP4, WEBM)</label>
                <input type="file" id="videoUpload" class="file-input" accept="video/*" onchange="handleVideoUpload(event)">
                <div id="fileNameDisplay" style="margin-top: 10px; font-size: 0.85rem; color: #a0aec0;">未選擇檔案</div>
            </div>

        </div>
            
    </div>

    <!-- 主程式邏輯 -->
    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const resultDiv = document.getElementById('result');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const fileNameDisplay = document.getElementById('fileNameDisplay');

        let animationFrameId = null;
        let holistic = null;
        let ws = null;

        let isProcessing = false;
        let lastProcessingTime = 0;
        const TARGET_FPS = 20;
        const FRAME_INTERVAL = 1000 / TARGET_FPS;

        // POSE 與 FACE 關鍵點索引 (對齊 config.py)
        const POSE_INDICES = [11, 12, 13, 14, 15, 16];
        const FACE_INDICES_TO_USE = [6, 129, 98, 2, 327, 358, 61, 91, 17, 321, 291, 267, 0, 37, 9, 284];

        // 處理使用者上傳影片
        function handleVideoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            fileNameDisplay.innerText = `已選擇檔案: ${file.name}`;
            const videoURL = URL.createObjectURL(file);
            videoElement.src = videoURL;
            videoElement.load();

            videoElement.onloadeddata = () => {
                canvasElement.width = videoElement.videoWidth || 640;
                canvasElement.height = videoElement.videoHeight || 480;
                
                // 清空上一部影片殘留的 Canvas 骨架點
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                
                resultDiv.innerText = "影片已就緒，請點擊「開始播放與辨識」";
                resultDiv.style.color = "#00f2fe";
                startBtn.disabled = false;
            };
        }

        function initMediaPipe() {
            if (holistic) return;

            holistic = new Holistic({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
            });

            holistic.setOptions({
                modelComplexity: 0,
                smoothLandmarks: true,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            holistic.onResults((results) => {
                // 清空透明畫布 (因為底層就是 videoElement 影片本身，不需重複畫底圖)
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

                const width = canvasElement.width;
                const height = canvasElement.height;

                // 1. 繪製肩膀手臂關鍵點 (亮橘色圓點)
                if (results.poseLandmarks) {
                    canvasCtx.fillStyle = "#FF9900";
                    for (let i = 0; i < POSE_INDICES.length; i++) {
                        const lm = results.poseLandmarks[POSE_INDICES[i]];
                        if (lm) {
                            canvasCtx.beginPath();
                            canvasCtx.arc(lm.x * width, lm.y * height, 3.5, 0, 2 * Math.PI);
                            canvasCtx.fill();
                        }
                    }
                }

                // 2. 繪製左手關鍵點 (青色)
                if (results.leftHandLandmarks) {
                    drawLandmarksFast(results.leftHandLandmarks, "#00FFCC", width, height);
                }

                // 3. 繪製右手關鍵點 (黃綠色)
                if (results.rightHandLandmarks) {
                    drawLandmarksFast(results.rightHandLandmarks, "#38EF7D", width, height);
                }

                // 4. 繪製臉部關鍵點 (粉藍色)
                if (results.faceLandmarks) {
                    canvasCtx.fillStyle = "#00D2FF";
                    for (let i = 0; i < FACE_INDICES_TO_USE.length; i++) {
                        const lm = results.faceLandmarks[FACE_INDICES_TO_USE[i]];
                        if (lm) {
                            canvasCtx.beginPath();
                            canvasCtx.arc(lm.x * width, lm.y * height, 2.5, 0, 2 * Math.PI);
                            canvasCtx.fill();
                        }
                    }
                }

                // --------------------------------------------------------
                // 打包 198 維特徵向量
                // --------------------------------------------------------
                let landmarksData = new Array(198).fill(0);
                let idx = 0;

                // POSE (24維)
                if (results.poseLandmarks) {
                    for (let i = 0; i < POSE_INDICES.length; i++) {
                        const lm = results.poseLandmarks[POSE_INDICES[i]];
                        if (lm) {
                            landmarksData[idx++] = lm.x;
                            landmarksData[idx++] = lm.y;
                            landmarksData[idx++] = lm.z;
                            landmarksData[idx++] = lm.visibility || 0;
                        } else { idx += 4; }
                    }
                } else { idx += 24; }

                // LEFT HAND (63維)
                if (results.leftHandLandmarks) {
                    for (let i = 0; i < results.leftHandLandmarks.length; i++) {
                        const lm = results.leftHandLandmarks[i];
                        landmarksData[idx++] = lm.x;
                        landmarksData[idx++] = lm.y;
                        landmarksData[idx++] = lm.z;
                    }
                } else { idx += 63; }

                // RIGHT HAND (63維)
                if (results.rightHandLandmarks) {
                    for (let i = 0; i < results.rightHandLandmarks.length; i++) {
                        const lm = results.rightHandLandmarks[i];
                        landmarksData[idx++] = lm.x;
                        landmarksData[idx++] = lm.y;
                        landmarksData[idx++] = lm.z;
                    }
                } else { idx += 63; }

                // FACE (48維)
                if (results.faceLandmarks) {
                    for (let i = 0; i < FACE_INDICES_TO_USE.length; i++) {
                        const lm = results.faceLandmarks[FACE_INDICES_TO_USE[i]];
                        if (lm) {
                            landmarksData[idx++] = lm.x;
                            landmarksData[idx++] = lm.y;
                            landmarksData[idx++] = lm.z;
                        } else { idx += 3; }
                    }
                } else { idx += 48; }

                while (idx < 198) landmarksData[idx++] = 0;
                landmarksData = landmarksData.slice(0, 198);

                // 判斷是否有手語手勢
                const hasLeftHand = !!results.leftHandLandmarks;
                const hasRightHand = !!results.rightHandLandmarks;

                if (hasLeftHand || hasRightHand) {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ landmarks: landmarksData }));
                    }
                } else {
                    resultDiv.innerText = "等待手勢中...";
                    resultDiv.style.color = "#a0aec0";
                }

                isProcessing = false;
            });
        }

        // 高效點位繪製函式
        function drawLandmarksFast(landmarks, color, width, height) {
            canvasCtx.fillStyle = color;
            for (let i = 0; i < landmarks.length; i++) {
                const lm = landmarks[i];
                canvasCtx.beginPath();
                canvasCtx.arc(lm.x * width, lm.y * height, 3, 0, 2 * Math.PI);
                canvasCtx.fill();
            }
        }

        async function processFrame() {
            if (videoElement.paused || videoElement.ended) return;

            const now = Date.now();
            if (!isProcessing && (now - lastProcessingTime >= FRAME_INTERVAL)) {
                if (videoElement.readyState >= 2) {
                    isProcessing = true;
                    lastProcessingTime = now;
                    await holistic.send({ image: videoElement });
                }
            }

            animationFrameId = requestAnimationFrame(processFrame);
        }

        async function startVideoRecognition() {
            try {
                resultDiv.innerText = "正在連線後端...";
                resultDiv.style.color = "#00f2fe";

                // 1. 建立 WebSocket 連線
                ws = new WebSocket("ws://localhost:8000/ws/predict");
                
                ws.onopen = () => {
                    resultDiv.innerText = "已連線後端，開始播放分析...";
                    resultDiv.style.color = "#00ffcc";
                    
                    // 開始播放影片並進行畫面串流處理
                    videoElement.play();
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    processFrame();
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        resultDiv.innerText = `${data.prediction} ${data.confidence ? '(' + data.confidence + '%)' : ''}`;
                        resultDiv.style.color = "#00f2fe";
                    } catch (e) {
                        console.error("解析回應失敗:", e);
                    }
                };

                ws.onerror = (error) => {
                    console.error("WebSocket 錯誤:", error);
                    resultDiv.innerText = "後端連線失敗！請檢查 Python main.py";
                    resultDiv.style.color = "#ff3333";
                };

                ws.onclose = () => {
                    console.log("WebSocket 連線已關閉");
                };

                initMediaPipe();

            } catch (error) {
                console.error("啟動失敗:", error);
                resultDiv.innerText = "辨識啟動失敗";
                resultDiv.style.color = "#ff3333";
            }
        }

        function stopVideoRecognition() {
            videoElement.pause();

            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
                animationFrameId = null;
            }

            if (ws) {
                ws.close();
                ws = null;
            }

            isProcessing = false;
            resultDiv.innerText = "影片已暫停";
            resultDiv.style.color = "#00f2fe";
            startBtn.disabled = false;
            stopBtn.disabled = true;
        }

        // 監聽影片原生播放 event
        videoElement.onplay = () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                startVideoRecognition();
            } else {
                processFrame();
            }
        };

        videoElement.onpause = () => {
            stopVideoRecognition();
        };

        videoElement.onended = () => {
            stopVideoRecognition();
            resultDiv.innerText = "影片播放完畢";
            resultDiv.style.color = "#38ef7d";
        };
    </script>
</body>
</html>
