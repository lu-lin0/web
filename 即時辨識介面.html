<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即時辨識介面</title>
    
   <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
    


    <style>

.header-title {
    color: var(--white-color);
    font-size: 1.2rem;
    font-weight: bold;
}

.nav-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    padding: 8px 20px;
    border-radius: 20px;
    color: var(--white-color);
    font-size: 0.95rem;
    font-weight: 600;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid var(--card-border);
    transition: all 0.3s ease;
}

.nav-link:hover {
    background: rgba(255, 255, 255, 0.18);
    transform: translateY(-2px);
}

/* 即時辨識雙欄主佈局 */
.recognition-layout {
    margin-top: 100px;
    display: grid;
    grid-template-columns: 640px 320px;
    gap: 25px;
    max-width: 1000px;
    width: 90%;
    margin-bottom: 40px;
}

.left-column {
    display: flex;
    flex-direction: column;
    gap: 20px;
}


/* 相機畫面顯示區域 */
.camera-container {
    position: relative;
    width: 640px;
    height: 480px;
    background-color: #000000;
    border-radius: 20px;
    border: 1px solid var(--card-border);
    overflow: hidden;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
}
#input_video, #output_canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 640px;
    height: 480px;
    transform: scaleX(-1); 
}


/* 控制按鈕區塊 */
.controls {
    display: flex;
    gap: 15px;
    justify-content: center;
}
.btn {
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    color: #ffffff;
    transition: all 0.3s ease;
    letter-spacing: 1px;
}
/*開啟鏡頭按鈕 */
.btn-start {
    background: var(--secondary-gradient);
    box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
}
.btn-start:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(56, 239, 125, 0.5);
}

/*關閉鏡頭按鈕 */
.btn-stop {
    background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
    box-shadow: 0 4px 15px rgba(255, 65, 108, 0.3);
}
.btn-stop:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(255, 65, 108, 0.5);
}

/*未啟用按鈕 */
.btn:disabled {
    background: #555555;
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

    </style>
    <link href="style.css" rel="stylesheet" type="text/css">
</head>
<body>

    <div id="header">
        <a href="主介面.html" class="nav-link">首頁</a>
    </div>

    <div class="recognition-layout">
    
    <!-- 主區塊：相機、控制按鈕、預測文字-->
    <div class="left-column">
        
        <!--相機畫面 -->
        <div class="camera-container">
            <video id="input_video" playsinline muted style="display:none;"></video>
            <canvas id="output_canvas" width="640" height="480"></canvas>
        </div>

        <!--控制按鈕區塊 -->
        <div class="controls">
            <button id="startBtn" class="btn btn-start" onclick="startCamera()">開啟鏡頭</button>
            <button id="stopBtn" class="btn btn-stop" onclick="stopCamera()" disabled>關閉鏡頭</button>
        </div>

        <!--預測文字卡片 -->
        <div class="prediction-card">
            <div class="prediction-title">後端辨識結果</div>
            <div id="result" class="prediction-text">鏡頭未開啟</div>
        </div>

    </div> 

    <!--連結放置區 -->
    <div class="right-column">
        <h3>參考連結放置區</h3>
        <ul class="link-list">
                <li><a href="https://youtu.be/5TMrRtjHA3c?si=pfN7k4Lqbkh4H9iu">你</a></li>
                <li><a href="https://youtu.be/vr4roHtu4z4?si=u6eqxRnQfruUlLS5">我</a></li>
                <li><a href="https://www.youtube.com/watch?v=T2dnwq1Teg0">他</a></li>
                <li><a href="https://youtu.be/mLYKdD7rU2I?si=6Hzr7OmT7tX9TNyi">謝謝</a></li>
                <li><a href="">對不起</a></li>
                <li><a href="">知道</a></li>
                <li><a href="">可以</a></li>
                <li><a href="">不可以</a></li>
                <li><a href="">是</a></li>
                <li><a href="">不是</a></li>
                <li><a href="">高興</a></li>
                <li><a href="">不客氣</a></li>

            </ul>
    </div>

</div>



    <!--主程式 -->
    <script>
        const videoElement = document.getElementById('input_video');
const canvasElement = document.getElementById('output_canvas');
const canvasCtx = canvasElement.getContext('2d');
const resultDiv = document.getElementById('result');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

let stream = null;
let animationFrameId = null;
let holistic = null;
let ws = null;

let isProcessing = false;
let lastProcessingTime = 0;
const TARGET_FPS = 10;
const FRAME_INTERVAL = 1000 / TARGET_FPS;

// 1. POSE 關鍵點 (6個點 * 4值 = 24維)
const POSE_INDICES = [11, 12, 13, 14, 15, 16];

// 2. 對齊 config.py 的 FACE_INDEX 字典定義
const FACE_INDEX_CONFIG = {
    "right_eyebrow": [46, 52, 55, 107, 105, 70],
    "left_eyebrow": [276, 282, 285, 336, 334, 300],
    "right_eye": [33, 145, 133, 158, 159],
    "left_eye": [362, 374, 263, 386, 385],
    "nose": [6, 129, 98, 2, 327, 358],
    "mouth": [61, 91, 17, 321, 291, 267, 0, 37],
    "forehead": [9, 284, 297, 10, 67, 54],
    "chin": [152, 400, 431, 406, 18, 182, 211, 176]
};

// 將 config.py 的 FACE_INDEX 展開成陣列清單
const ALL_CONFIG_FACE_INDICES = Object.values(FACE_INDEX_CONFIG).flat();

// 取前 16 個點填補至 198 維特徵中 (16點 * 3 = 48維)
const FEATURE_FACE_INDICES = ALL_CONFIG_FACE_INDICES.slice(0, 16);

function initMediaPipe() {
    if (holistic) return;

    holistic = new Holistic({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
    });

    holistic.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    holistic.onResults((results) => {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        // --------------------------------------------------------
        // 🎨 畫布繪圖：雙手骨架 + config.py 定義的臉部關鍵點
        // --------------------------------------------------------
        
        // 1. 繪製左手 (青色)
        if (results.leftHandLandmarks) {
            drawLandmarks(results.leftHandLandmarks, "#00FFCC");
        }
        // 2. 繪製右手 (黃綠色)
        if (results.rightHandLandmarks) {
            drawLandmarks(results.rightHandLandmarks, "#38EF7D");
        }

        // 3. 🎯 根據 config.py FACE_INDEX 繪製臉部特徵點 (亮藍色)
        if (results.faceLandmarks) {
            canvasCtx.fillStyle = "#00D2FF";
            for (let i of ALL_CONFIG_FACE_INDICES) {
                let lm = results.faceLandmarks[i];
                if (lm) {
                    const x = lm.x * canvasElement.width;
                    const y = lm.y * canvasElement.height;
                    canvasCtx.beginPath();
                    canvasCtx.arc(x, y, 2.5, 0, 2 * Math.PI);
                    canvasCtx.fill();
                }
            }
        }

        canvasCtx.restore();

        // --------------------------------------------------------
        // 🎯 特徵打包：嚴格輸出 198 維特徵向量
        // --------------------------------------------------------
        let landmarksData = new Array(198).fill(0);
        let idx = 0;

        // (1) POSE (24維: 6點 * 4值)
        if (results.poseLandmarks) {
            for (let i of POSE_INDICES) {
                let lm = results.poseLandmarks[i];
                if (lm) {
                    landmarksData[idx++] = lm.x;
                    landmarksData[idx++] = lm.y;
                    landmarksData[idx++] = lm.z;
                    landmarksData[idx++] = lm.visibility || 0;
                } else {
                    idx += 4;
                }
            }
        } else {
            idx += 24;
        }

        // (2) LEFT HAND (63維: 21點 * 3值)
        if (results.leftHandLandmarks) {
            for (let lm of results.leftHandLandmarks) {
                landmarksData[idx++] = lm.x;
                landmarksData[idx++] = lm.y;
                landmarksData[idx++] = lm.z;
            }
        } else {
            idx += 63;
        }

        // (3) RIGHT HAND (63維: 21點 * 3值)
        if (results.rightHandLandmarks) {
            for (let lm of results.rightHandLandmarks) {
                landmarksData[idx++] = lm.x;
                landmarksData[idx++] = lm.y;
                landmarksData[idx++] = lm.z;
            }
        } else {
            idx += 63;
        }

        // (4) FACE (48維: 16點 * 3值，取自 config.py FACE_INDEX)
        if (results.faceLandmarks) {
            for (let i of FEATURE_FACE_INDICES) {
                let lm = results.faceLandmarks[i];
                if (lm) {
                    landmarksData[idx++] = lm.x;
                    landmarksData[idx++] = lm.y;
                    landmarksData[idx++] = lm.z;
                } else {
                    idx += 3;
                }
            }
        } else {
            idx += 48;
        }

        // 防禦性長度校正，確保輸出精確為 198 維
        while (idx < 198) {
            landmarksData[idx++] = 0;
        }
        landmarksData = landmarksData.slice(0, 198);

        // --------------------------------------------------------
        // 攔截機制：必須有偵測到雙手手勢才發送至後端
        // --------------------------------------------------------
        const hasLeftHand = !!results.leftHandLandmarks;
        const hasRightHand = !!results.rightHandLandmarks;

        if (hasLeftHand || hasRightHand) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ landmarks: landmarksData }));
            }
        } else {
            resultDiv.innerText = "等待手勢中...";
            resultDiv.style.color = "#a0aec0";
        }

        isProcessing = false;
    });
}

function drawLandmarks(landmarks, color) {
    canvasCtx.fillStyle = color;
    for (let lm of landmarks) {
        const x = lm.x * canvasElement.width;
        const y = lm.y * canvasElement.height;
        canvasCtx.beginPath();
        canvasCtx.arc(x, y, 3, 0, 2 * Math.PI);
        canvasCtx.fill();
    }
}

async function processFrame() {
    if (!stream) return;

    const now = Date.now();
    if (!isProcessing && (now - lastProcessingTime >= FRAME_INTERVAL)) {
        if (videoElement.readyState >= 2) {
            isProcessing = true;
            lastProcessingTime = now;
            await holistic.send({ image: videoElement });
        }
    }

    animationFrameId = requestAnimationFrame(processFrame);
}

async function startCamera() {
    try {
        resultDiv.innerText = "正在連線後端...";
        resultDiv.style.color = "#00f2fe";

        ws = new WebSocket("ws://localhost:8000/ws/predict");
        
        ws.onopen = () => {
            resultDiv.innerText = "已連線至後端，等待手勢...";
            resultDiv.style.color = "#00ffcc";
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                resultDiv.innerText = `${data.prediction} ${data.confidence ? '(' + data.confidence + '%)' : ''}`;
                resultDiv.style.color = "#00f2fe";
            } catch (e) {
                console.error("解析回應錯誤:", e);
            }
        };

        ws.onerror = (error) => {
            console.error("WebSocket 錯誤:", error);
            resultDiv.innerText = "後端連線失敗！請檢查 Python main.py";
            resultDiv.style.color = "#ff3333";
        };

        ws.onclose = () => {
            console.log("WebSocket 連線關閉");
        };

        initMediaPipe();

        stream = await navigator.mediaDevices.getUserMedia({
            video: { width: { ideal: 640 }, height: { ideal: 480 } },
            audio: false
        });

        videoElement.srcObject = stream;
        await videoElement.play();

        startBtn.disabled = true;
        stopBtn.disabled = false;

        processFrame();

    } catch (error) {
        console.error("啟動失敗:", error);
        resultDiv.innerText = "相機開啟失敗，請確認權限";
        resultDiv.style.color = "#ff3333";
    }
}

function stopCamera() {
    if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
    }

    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        videoElement.srcObject = null;
        stream = null;
    }

    if (ws) {
        ws.close();
        ws = null;
    }

    isProcessing = false;
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
    
    resultDiv.innerText = "鏡頭未開啟";
    resultDiv.style.color = "#00f2fe";
    startBtn.disabled = false;
    stopBtn.disabled = true;
}
    </script>
</body>
</html>
